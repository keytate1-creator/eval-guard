[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-guard"
version = "0.1.0"
authors = [
  { name="Kaylor Tate Cespedes", email="kaylortate@users.noreply.github.com" },
]
description = "High-Throughput Deterministic Constraint & AST Evaluation Engine for LLM Outputs"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
eval-guard = "eval_guard.cli:main"
